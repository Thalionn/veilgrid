<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>VeilGrid invite</title>
<style>
  :root{color-scheme:dark}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#0b0d0f;color:#f5f7f8;font:16px/1.5 -apple-system,system-ui,sans-serif}
  main{width:min(92vw,460px);padding:32px;border:1px solid #273038;border-radius:20px;background:#11161a}
  h1{font-size:22px;margin:0 0 8px}
  p{color:#9aa7b2;margin:0 0 20px}
  code{display:block;word-break:break-all;background:#0b0d0f;border:1px solid #273038;
    border-radius:12px;padding:12px;font:12px/1.45 ui-monospace,monospace;color:#b9c5cf;margin:0 0 14px}
  button,a.button{display:block;width:100%;box-sizing:border-box;text-align:center;cursor:pointer;
    border:0;border-radius:12px;padding:13px;font-weight:600;font-size:15px;text-decoration:none;margin:0 0 10px}
  #open{background:#1fd9a0;color:#06120e}
  #copy{background:#1b232a;color:#e8eef2;border:1px solid #2c3741}
  .hint{font-size:13px;color:#6f7d88}
</style>
</head>
<body>
<main>
  <h1>VeilGrid invite</h1>
  <p id="subtitle">Paste this code into VeilGrid → Contacts → Add contact.</p>
  <code id="code">Loading…</code>
  <button id="copy">Copy code</button>
  <p class="hint">VeilGrid has no account server. This code only lets the person who sent it share location with you.</p>
</main>
<script>
(function () {
  var p = new URLSearchParams(location.search);
  var code = p.get('code') || '';
  var two = p.get('two') === '1';
  var token = p.get('t') || '';
  var codeEl = document.getElementById('code');
  var copyEl = document.getElementById('copy');
  codeEl.textContent = code || 'This invite link is missing its code.';
  if (two) {
    document.getElementById('subtitle').textContent =
      'Open VeilGrid to link both ways, or paste this code into Contacts → Add contact.';
    var q = 'code=' + encodeURIComponent(code) + '&two=1' + (token ? '&t=' + encodeURIComponent(token) : '');
    codeEl.textContent = 'veilgrid://link?' + q;
  }
  copyEl.onclick = function () {
    var text = codeEl.textContent || '';
    if (navigator.clipboard) navigator.clipboard.writeText(text);
    copyEl.textContent = 'Copied';
    setTimeout(function () { copyEl.textContent = 'Copy code'; }, 1400);
  };
})();
</script>
</body>
</html>
