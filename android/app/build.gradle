plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// The Google Services plugin needs google-services.json (Firebase config),
// which is not committed to the repo. Apply it only when a config file is
// present so a plain debug build without Firebase still works. FCM push is
// optional at runtime (Firebase.initializeApp is wrapped in try/catch and the
// app falls back to UnifiedPush).
def hasGoogleServicesJson =
    file('google-services.json').exists() ||
    file('src/google-services.json').exists() ||
    file('src/debug/google-services.json').exists()
if (hasGoogleServicesJson) {
    apply plugin: 'com.google.gms.google-services'
}

// Load local.properties
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

// Load key.properties for signing
def keyProperties = new Properties()
def keyPropertiesFile = rootProject.file('key.properties')
if (keyPropertiesFile.exists()) {
    keyPropertiesFile.withReader('UTF-8') { reader ->
        keyProperties.load(reader)
    }
}

// Provide defaults if not found in local.properties
def flutterVersionCode = localProperties.getProperty('flutter.versionCode', '1')
def flutterVersionName = localProperties.getProperty('flutter.versionName', '1.0')


// Two Tink artifacts provide the same classes: UnifiedPush pulls the Java
// `tink` (no Android integration), while androidx.security:security-crypto
// needs `tink-android` for AndroidKeysetManager. Veilid's protected store
// (EncryptedSharedPreferences) only works with the Android artifact, so keep
// tink-android and drop the Java one instead of the other way around.
configurations.all {
    exclude group: 'com.google.crypto.tink', module: 'tink'
}

android {
    namespace "app.thalionn.veilgrid"
    compileSdkVersion rootProject.ext.compileSdkVersion
    ndkVersion "28.0.12433566"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    defaultConfig {
        applicationId "app.thalionn.veilgrid"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        manifestPlaceholders = [applicationName: "android.app.Application"]
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }


    signingConfigs {
        release {
            keyAlias localProperties.getProperty('keyAlias')
            keyPassword localProperties.getProperty('keyPassword')
            storePassword localProperties.getProperty('storePassword')
            // Only set the keystore path when one is configured. Without a
            // signing `storeFile` in local.properties, `file(null)` throws
            // "path may not be null" on every build — including debug builds
            // that never use the release config.
            def storeFilePath = localProperties.getProperty('storeFile')
            if (storeFilePath != null && !storeFilePath.isEmpty()) {
                storeFile file(storeFilePath)
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.3"
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
}
