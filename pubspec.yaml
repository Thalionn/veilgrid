name: grid_frontend
description: "VeilGrid: private, serverless location sharing over Veilid"
publish_to: 'none'
version: 2.3.12+2015
environment:
  sdk: '>=3.3.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  maplibre_gl: ^0.26.0
  google_fonts: ^8.2.1
  latlong2: ^0.10.1
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^9.2.4
  path: ^1.9.1
  path_provider: ^2.1.5
  sqflite: ^2.4.2
  encrypt: ^5.0.3
  http: ^1.5.0
  permission_handler: ^12.0.1
  qr_flutter: ^4.1.0
  libre_location: ^0.4.1
  geolocator: ^13.0.4
  qr_code_scanner_plus: ^2.5.0
  package_info_plus: ^8.3.1
  veilid:
    git:
      url: https://gitlab.com/veilid/veilid.git
      path: veilid-flutter
      ref: v0.5.8
  battery_plus: ^7.1.2
  connectivity_plus: ^7.3.1
  share_plus: ^12.0.2
  image_picker: ^1.2.4
  image: ^4.13.1
  crypto: ^3.0.8

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/brand/04-app-icon/grid-app-icon-appstore-1024.png"
  remove_alpha_ios: true
  min_sdk_android: 21
  adaptive_icon_background: "#191B1E"
  adaptive_icon_foreground: "assets/brand/04-app-icon/grid-app-icon-1024.png"
  adaptive_icon_padding: false

flutter_native_splash:
  color: "#0B0D0F"
  color_dark: "#0B0D0F"
  image: "assets/brand/01-logos/grid-symbol-color-512.png"
  image_dark: "assets/brand/01-logos/grid-symbol-color-dark-512.png"
  android_12:
    image: "assets/brand/01-logos/grid-symbol-color-splash12-704.png"
    image_dark: "assets/brand/01-logos/grid-symbol-color-dark-splash12-704.png"
    color: "#0B0D0F"
    color_dark: "#0B0D0F"
  ios: true
  android: true
  fullscreen: true

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.8

dependency_overrides:
  # Fork of maplibre_gl v0.26.1 with upstream PR #820 backported + the
  # zero-frame guard extended to camera#move and camera#animate handlers.
  # Fixes the SIGABRT out of mbgl::LatLng that no Dart-side gating could
  # reliably catch (no Dart observable mirrors MLNMapView.bounds.size).
  maplibre_gl:
    git:
      url: https://github.com/Rezivure/flutter-maplibre-gl.git
      ref: fix/grid-defer-camera-on-zero-frame
      path: maplibre_gl
  libre_location:
    git:
      url: https://github.com/Rezivure/libre-location.git
      ref: v0.4.3

flutter:
  uses-material-design: true
  # Bundled so the first frame never waits on a Google Fonts download and the
  # UI cannot reflow when a font arrives. google_fonts finds these by filename.
  assets:
    - assets/google_fonts/

